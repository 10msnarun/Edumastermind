# ==============================================================================
# EduMastermind Web - Nginx Production Server Configuration
# Optimized for Vite React Single-Page Application (SPA)
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Document root hosting compiled Vite assets
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Charset
    charset utf-8;

    # --------------------------------------------------------------------------
    # Gzip Compression for Fast Page Loads
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # --------------------------------------------------------------------------
    # Security Headers (OWASP Recommended)
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --------------------------------------------------------------------------
    # Health Check Endpoint for Docker & Cloud Orchestration
    # Returns 200 OK directly without disk I/O or access logging
    # --------------------------------------------------------------------------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Optional JSON status endpoint for detailed container inspection
    location = /api/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"edumastermind-web","timestamp":"$time_iso8601"}';
    }

    # --------------------------------------------------------------------------
    # Static Assets with Content-Hash in Filename (Vite dist/assets/*)
    # Aggressively cached for 1 year with immutable flag
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Single-Page Application (SPA) Client-Side Route Fallback
    # Supports nested React routes on reload: /courses, /mastery-arena, /analytics, etc.
    # index.html must NEVER be cached to ensure users receive immediate code updates.
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Disable caching for HTML entry point
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # --------------------------------------------------------------------------
    # Custom Error Pages
    # --------------------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
